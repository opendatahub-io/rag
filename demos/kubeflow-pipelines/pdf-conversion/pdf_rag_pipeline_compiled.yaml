# PIPELINE DEFINITION
# Name: vector-store-files-pipeline
# Description: Creates a vector store with embeddings from PDF files from a GitHub source.
# Inputs:
#    base_url: str [Default: 'https://raw.githubusercontent.com/docling-project/docling/v2.62.0/tests/data/pdf']
#    chunk_overlap_tokens: int [Default: 64.0]
#    embedding_model_id: str [Default: 'sentence-transformers/ibm-granite/granite-embedding-125m-english']
#    max_tokens: int [Default: 512.0]
#    pdf_filenames: str [Default: '2203.01017v2.pdf, 2206.01062.pdf, 2305.03393v1-pg9.pdf, amt_handbook_sample.pdf, code_and_formula.pdf, multi_page.pdf, picture_classification.pdf, redp5110_sampled.pdf, right_to_left_01.pdf, right_to_left_02.pdf, right_to_left_03.pdf']
#    service_url: str [Default: 'http://lsd-milvus-service:8321']
#    use_gpu: bool [Default: False]
#    vector_store_name: str [Default: 'pdf-vector-store']

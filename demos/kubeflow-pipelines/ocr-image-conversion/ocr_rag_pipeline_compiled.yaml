# PIPELINE DEFINITION
# Name: vector-store-files-pipeline
# Description: Converts images to text using OCR and generates embeddings
# Inputs:
#    base_url: str [Default: 'https://raw.githubusercontent.com/opendatahub-io/rag/main/demos/testing-data/images']
#    chunk_overlap_tokens: int [Default: 64.0]
#    embedding_model_id: str [Default: 'sentence-transformers/ibm-granite/granite-embedding-125m-english']
#    image_filenames: str [Default: 'RAG_flow_diagram.png, RAG_key_market_usecases.png']
#    max_tokens: int [Default: 512.0]
#    service_url: str [Default: 'http://lsd-milvus-service:8321']
#    use_gpu: bool [Default: False]
#    vector_store_name: str [Default: 'ocr-vector-store']

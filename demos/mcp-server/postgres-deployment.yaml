---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ragathon-team-1
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=  # base64 encoded 'postgres'
  POSTGRES_PASSWORD: cG9zdGdyZXM=  # base64 encoded 'postgres'
  POSTGRES_DB: YmFua19zdGF0ZW1lbnRz  # base64 encoded 'bank_statements'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ragathon-team-1
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
